services:
  api:
    container_name: itoi-api
    image: ${API_IMAGE:-vasco4marques/itoi:latest}
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${API_HOST_PORT:-3000}:3000"
    expose:
      - "3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - './:/home/theia/projectos'
    depends_on:
      db:
        condition: service_healthy
      lsp:
        condition: service_started

  lsp:
    container_name: itoi-lsp
    image: ${LSP_IMAGE:-vasco4marques/itoi-lsp:latest}
    build: ./dsl-lsp-service
    restart: unless-stopped
    environment:
      PORT: "3001"
      ITLINGO_CLOUD_URL: ${ITLINGO_CLOUD_URL:-http://host.docker.internal:8069/}
      RESERVED_EXTENSIONS: ${RESERVED_EXTENSIONS:-}
      DSL_CACHE_TTL_MS: ${DSL_CACHE_TTL_MS:-60000}
      DSL_SERVICES_BUILD_TIMEOUT_MS: ${DSL_SERVICES_BUILD_TIMEOUT_MS:-10000}
    ports:
      - "${DSL_LSP_HOST_PORT:-3002}:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    container_name: itoi-db
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
    driver: local
