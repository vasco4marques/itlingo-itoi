services:
  api:
    container_name: itoi-api
    image: ${API_IMAGE:-vasco4marques/itoi:latest}
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${API_HOST_PORT:-3000}:3000"
    expose:
      - "3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - './:/home/theia/projectos'
    depends_on:
      db:
        condition: service_healthy
      lsp:
        condition: service_started

  lsp:
    container_name: itoi-lsp
    image: ${LSP_IMAGE:-vasco4marques/itoi-lsp:latest}
    build: ./dsl-lsp-service
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    environment:
      PORT: "3001"
      ITLINGO_CLOUD_URL: http://lsp-cloud-proxy:8080/
      RESERVED_EXTENSIONS: ${RESERVED_EXTENSIONS:-}
      DSL_CACHE_TTL_MS: ${DSL_CACHE_TTL_MS:-60000}
      DSL_SERVICES_BUILD_TIMEOUT_MS: ${DSL_SERVICES_BUILD_TIMEOUT_MS:-10000}
    tmpfs:
      - /app/.runtime-modules:rw,nosuid,nodev,noexec,size=64m,mode=0700,uid=10001,gid=10001
    ports:
      - "127.0.0.1:${DSL_LSP_HOST_PORT:-3002}:3001"
    networks:
      - lsp-isolated
    depends_on:
      lsp-cloud-proxy:
        condition: service_started

  lsp-cloud-proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    environment:
      CLOUD_UPSTREAM: ${ITLINGO_CLOUD_URL:-http://host.docker.internal:8069/}
    volumes:
      - ./dsl-lsp-service/cloud-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
    tmpfs:
      - /etc/nginx/conf.d:rw,nosuid,nodev,noexec,size=1m,mode=0755,uid=101,gid=101
      - /tmp:rw,nosuid,nodev,noexec,size=8m,mode=1777
      - /var/cache/nginx:rw,nosuid,nodev,noexec,size=8m,mode=0755,uid=101,gid=101
      - /var/run:rw,nosuid,nodev,noexec,size=1m,mode=0755,uid=101,gid=101
    networks:
      - lsp-isolated
      - default
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    container_name: itoi-db
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
    driver: local

networks:
  default:
  lsp-isolated:
    internal: true
